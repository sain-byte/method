        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;750&display=swap');
        :root {
          --bg: #080909;
          --panel: #0e1010;
          --panel-2: #121414;
          --border: #272b2b;
          --border-soft: #1c2020;
          --text: #f0f2f1;
          --muted: #858b89;
          --muted-2: #626966;
          --green: #62d98b;
          --green-dark: #173521;
          --danger: #ff7777;
          --radius: 11px;
        }
        * { box-sizing: border-box; }
        html, body {
          margin: 0;
          height: 100%;
          background: var(--bg);
          color: var(--text);
          font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        @media (min-width: 761px) {
          html, body { overflow: hidden; }
        }
        body { min-height: 100dvh; }
        button, input { font: inherit; }
        button { color: inherit; }

        .app {
          width: min(980px, calc(100% - 20px));
          height: 100dvh;
          margin: 0 auto;
          padding: 14px 0 8px;
          display: flex;
          flex-direction: column;
          gap: 0;
        }
        .app.has-file #mainLayout { grid-template-columns: 1.25fr 0.75fr; }

        header {
          position: relative;
          margin-bottom: 10px;
          padding-right: 90px;
          flex-shrink: 0;
        }
        .title {
          margin: 0;
          font-size: clamp(22px, 3.2vw, 30px);
          line-height: 1;
          font-weight: 700;
          letter-spacing: -1.2px;
        }
        .handle {
          display: inline-block;
          margin-top: 6px;
          color: var(--text);
          text-decoration: none;
          font-size: 12px;
          transition: color .18s ease;
        }
        .handle:hover { color: var(--green); }
        .powered {
          margin-top: 2px;
          color: var(--muted);
          font-size: 10px;
        }
        .tutorial-btn {
          position: absolute;
          top: 1px;
          right: 0;
          padding: 7px 10px;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: transparent;
          color: #b9bfbc;
          font-size: 10px;
          font-weight: 600;
          letter-spacing: .35px;
          cursor: pointer;
          transition: border-color .18s ease, color .18s ease, background .18s ease;
        }
        .tutorial-btn:hover {
          border-color: #454b48;
          background: #101212;
          color: #fff;
        }

        .main-layout {
          display: grid;
          grid-template-columns: 1fr;
          gap: 14px;
          flex: 1;
          min-height: 0;
          overflow: hidden;
        }
        .left-stack {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-height: 0;
        }
        .main-layout:not(.has-file) .left-stack {
          align-items: center;
          justify-content: center;
          min-height: 200px;
        }
        .right-stack {
          display: flex;
          flex-direction: column;
          gap: 10px;
          min-height: 0;
          overflow: hidden;
        }

        .upload-box {
          min-height: 120px;
          border: 1px dashed #343a38;
          border-radius: var(--radius);
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          cursor: pointer;
          transition: border-color .18s ease, background .18s ease;
          width: 100%;
          max-width: 520px;
          padding: 20px;
          margin: auto 0;
        }
        .upload-box:hover,
        .upload-box.dragover {
          border-color: #59615e;
          background: #0c0e0e;
        }
        .upload-inner { padding: 0 12px; }
        .upload-title { font-size: 14px; font-weight: 600; }
        .upload-sub { margin-top: 7px; color: var(--muted); font-size: 11px; }
        .upload-box input { display: none; }

        .preview-section {
          display: flex;
          flex-direction: column;
          gap: 6px;
          flex: 1;
          min-height: 0;
        }
        .video-wrap {
          width: 100%;
          flex: 1;
          min-height: 0;
          aspect-ratio: 16 / 9;
          max-height: 320px;
          background: #050606;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          overflow: hidden;
        }
        video {
          width: 100%;
          height: 100%;
          display: block;
          object-fit: contain;
          background: #050606;
        }
        .file-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }
        .file-name {
          min-width: 0;
          color: #d9dddb;
          font-size: 11px;
          line-height: 1.3;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .replace-btn {
          flex: 0 0 auto;
          padding: 7px 11px;
          border: 1px solid #303634;
          border-radius: 8px;
          background: #111313;
          color: #cfd4d1;
          font-size: 10px;
          font-weight: 600;
          cursor: pointer;
          transition: .18s ease;
        }
        .replace-btn:hover { border-color: #505754; color: #fff; }

        .section { margin-top: 0; }
        .section-title {
          margin-bottom: 5px;
          color: #9ca29f;
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 1px;
          text-transform: uppercase;
        }

        .info-file {
          margin-bottom: 6px;
          color: #d8ddda;
          font-size: 10px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .info-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 16px;
          row-gap: 0;
          padding: 0;
        }
        .info-item {
          min-width: 0;
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 8px;
          min-height: 23px;
          border-bottom: 1px solid var(--border-soft);
        }
        .info-item:nth-last-child(-n + 2) { border-bottom: 0; }
        .info-label {
          flex: 0 0 auto;
          color: #666d69;
          font-size: 7.5px;
          font-weight: 700;
          letter-spacing: .8px;
          text-transform: uppercase;
        }
        .info-value {
          min-width: 0;
          color: #d9dddb;
          font-size: 10px;
          font-weight: 500;
          text-align: right;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .checking { color: #727976; }
        .checking::after {
          content: "";
          display: inline-block;
          width: 3px;
          height: 3px;
          margin-left: 3px;
          vertical-align: middle;
          border-radius: 50%;
          background: #727976;
          animation: pulse 1s infinite ease-in-out;
        }
        @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }
        .info-status {
          min-height: 14px;
          margin-top: 4px;
          color: var(--muted);
          font-size: 9px;
        }

        .custom-select { position: relative; }
        .custom-select-trigger {
          width: 100%;
          min-height: 36px;
          padding: 0 38px 0 12px;
          position: relative;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--panel);
          color: #dfe3e1;
          text-align: left;
          font-size: 10.5px;
          cursor: pointer;
          transition: border-color .18s ease, background .18s ease;
        }
        .custom-select-trigger:hover,
        .custom-select.open .custom-select-trigger {
          border-color: #414846;
          background: var(--panel-2);
        }
        .custom-select-trigger::after {
          content: "";
          position: absolute;
          right: 14px;
          top: 50%;
          width: 6px;
          height: 6px;
          border-right: 1px solid #929996;
          border-bottom: 1px solid #929996;
          transform: translateY(-65%) rotate(45deg);
          transition: transform .18s ease;
        }
        .custom-select.open .custom-select-trigger::after {
          transform: translateY(-25%) rotate(225deg);
        }
        .custom-select-menu {
          position: absolute;
          z-index: 30;
          left: 0;
          right: 0;
          top: calc(100% + 6px);
          padding: 4px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: #0c0e0e;
          box-shadow: 0 16px 40px rgba(0,0,0,.42);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-5px);
          transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
        }
        .custom-select.open .custom-select-menu {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }
        .custom-option {
          width: 100%;
          padding: 9px 9px;
          border: 0;
          border-radius: 7px;
          background: transparent;
          color: #c5cbc8;
          text-align: left;
          font-size: 10px;
          cursor: pointer;
          transition: background .15s ease, color .15s ease;
        }
        .custom-option:hover { background: #151918; color: #fff; }
        .custom-option.active { background: #14231a; color: var(--green); }

        .patch-btn {
          width: 100%;
          min-height: 38px;
          margin-top: 6px;
          border: 1px solid #4ea96e;
          border-radius: var(--radius);
          background: var(--green);
          color: #071109;
          font-size: 10.5px;
          font-weight: 750;
          letter-spacing: .2px;
          cursor: pointer;
          transition: transform .12s ease, filter .18s ease, opacity .18s ease;
        }
        .patch-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .patch-btn:active:not(:disabled) { transform: translateY(1px); }
        .patch-btn:disabled { opacity: .45; cursor: not-allowed; }
        .patch-status {
          min-height: 15px;
          margin-top: 6px;
          color: var(--muted);
          font-size: 8.5px;
          line-height: 1.5;
          text-align: center;
        }
        .download-link {
          display: block;
          margin-top: 6px;
          color: var(--green);
          font-size: 10px;
          text-align: center;
          text-decoration: none;
        }
        .download-link:hover { text-decoration: underline; }

        footer {
          margin-top: auto;
          color: #505653;
          font-size: 8.5px;
          line-height: 1.5;
          text-align: center;
          flex-shrink: 0;
          padding-top: 6px;
          opacity: 0.55;
        }

        .modal-backdrop {
          position: fixed;
          z-index: 100;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 18px;
          background: rgba(0,0,0,.72);
          opacity: 0;
          visibility: hidden;
          transition: .18s ease;
        }
        .modal-backdrop.show {
          opacity: 1;
          visibility: visible;
        }
        .modal {
          width: min(470px, 100%);
          max-height: min(620px, 90dvh);
          overflow-y: auto;
          padding: 20px;
          border: 1px solid #303534;
          border-radius: 13px;
          background: #0d0f0f;
          box-shadow: 0 25px 70px rgba(0,0,0,.55);
          transform: translateY(8px) scale(.98);
          transition: .18s ease;
        }
        .modal-backdrop.show .modal { transform: translateY(0) scale(1); }
        .modal-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          margin-bottom: 17px;
        }
        .modal-title { margin: 0; font-size: 15px; font-weight: 750; }
        .modal-close {
          width: 30px;
          height: 30px;
          border: 1px solid var(--border);
          border-radius: 7px;
          background: transparent;
          color: #aeb5b2;
          font-size: 17px;
          line-height: 1;
          cursor: pointer;
        }
        .modal-close:hover { background: #151818; color: #fff; }
        .language-switch {
          display: flex;
          margin-bottom: 17px;
          padding: 3px;
          border: 1px solid var(--border);
          border-radius: 9px;
          background: #0a0c0c;
        }
        .language-btn {
          flex: 1;
          padding: 7px 10px;
          border: 0;
          border-radius: 6px;
          background: transparent;
          color: #747b78;
          font-size: 10px;
          font-weight: 700;
          cursor: pointer;
          transition: .15s ease;
        }
        .language-btn.active { background: #17261c; color: var(--green); }
        .tutorial-content h3 {
          margin: 0 0 13px;
          color: #e4e8e6;
          font-size: 13px;
          font-weight: 700;
        }
        .tutorial-content ol { margin: 0; padding-left: 19px; }
        .tutorial-content li {
          margin-bottom: 11px;
          color: #aeb5b2;
          font-size: 11px;
          line-height: 1.65;
        }
        .tutorial-content li:last-child { margin-bottom: 0; }
        .tutorial-content strong { color: #e4e8e6; }
        .tutorial-content a { color: var(--green); text-decoration: none; }
        .tutorial-content a:hover { text-decoration: underline; }

        .resolution-modal {
          width: min(390px, 100%);
