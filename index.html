<script type="module">

/* =========================================================
   ELEMENTS
========================================================= */

const videoInput =
  document.getElementById("video");

const dropzone =
  document.getElementById("dropzone");

const previewArea =
  document.getElementById("previewArea");

const preview =
  document.getElementById("preview");

const fileName =

const replaceBtn =

const infoSection =

const variantSection =

const infoFile =

const infoSize =
  document.getElementById("infoSize");

const infoDuration =
  document.getElementById("infoDuration");

const infoResolution =
  document.getElementById("infoResolution");

const infoFps =
  document.getElementById("infoFps");

const infoBitrate =
  document.getElementById("infoBitrate");

const infoFormat =
  document.getElementById("infoFormat");

const infoQuality =
  document.getElementById("infoQuality");

const patchButton =
  document.getElementById("patch");

const variant =
  document.getElementById("posting-device");

const status =
  document.getElementById("status");

const manualDownload =
  document.getElementById("manualDownload");

const download =
  document.getElementById("download");


let selectedFile = null;
let previewUrl = null;
let outputUrl = null;
let MP4BoxModule = null;


/* =========================================================
   MP4BOX
========================================================= */

async function getMP4Box(){

  if(MP4BoxModule){
    return MP4BoxModule;
  }

  status.textContent =
    "Loading media parser…";

  MP4BoxModule =
    await import(
      "https://cdn.jsdelivr.net/npm/mp4box@2.4.1/+esm"
    );

  return MP4BoxModule;
}


/* =========================================================
   HELPERS
========================================================= */

function formatBytes(bytes){

  if(!Number.isFinite(bytes)){
    return "—";
  }

  const units =
    ["B","KB","MB","GB"];

  let value = bytes;
  let index = 0;

  while(
    value >= 1024 &&
    index < units.length - 1
  ){
    value /= 1024;
    index++;
  }

  return (
    value.toFixed(
      index === 0 ? 0 : 1
    ) +
    " " +
    units[index]
  );
}


function formatDuration(seconds){

  if(
    !Number.isFinite(seconds) ||
    seconds < 0
  ){
    return "—";
  }

  seconds =
    Math.round(seconds);

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  const secs =
    seconds % 60;

  if(hours > 0){

    return (
      String(hours) +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(secs).padStart(2,"0")
    );

  }

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}


function formatBitrate(bits){

  if(
    !Number.isFinite(bits) ||
    bits <= 0
  ){
    return "—";
  }

  if(bits >= 1000000){

    return (
      (bits / 1000000).toFixed(1) +
      " Mbps"
    );

  }

  if(bits >= 1000){

    return (
      Math.round(bits / 1000) +
      " kbps"
    );

  }

  return (
    Math.round(bits) +
    " bps"
  );
}


function simplifyCodec(codec){

  const c =
    String(codec || "")
      .toLowerCase();

  if(
    c.startsWith("hvc1") ||
    c.startsWith("hev1") ||
    c.includes("hevc")
  ){
    return "HEVC";
  }

  if(
    c.startsWith("avc1") ||
    c.startsWith("avc3") ||
    c.includes("h264") ||
    c.includes("avc")
  ){
    return "H.264";
  }

  if(
    c.startsWith("av01") ||
    c.includes("av1")
  ){
    return "AV1";
  }

  if(
    c.startsWith("vp09") ||
    c.includes("vp9")
  ){
    return "VP9";
  }

  return codec || "Unknown";
}


function detectQuality(track){

  const text =
    JSON.stringify(track || {})
      .toLowerCase();

  if(
    text.includes("dvhe") ||
    text.includes("dvh1") ||
    text.includes("dovi") ||
    text.includes("dolby")
  ){
    return "Dolby Vision";
  }

  if(
    text.includes("arib-std-b67") ||
    text.includes("hlg")
  ){
    return "HLG";
  }

  if(
    text.includes("hdr10+") ||
    text.includes("hdr10plus") ||
    text.includes("dynamic_hdr")
  ){
    return "HDR10+";
  }

  if(
    text.includes("smpte2084") ||
    text.includes("pq")
  ){
    return "HDR10";
  }

  return "SDR";
}


/* =========================================================
   PARSE MP4
========================================================= */

async function parseMP4(file){

  const MP4Box =
    await getMP4Box();

  return new Promise(
    (resolve,reject) => {

      let finished = false;

      const mp4 =
        MP4Box.createFile();

      mp4.onError =
        error => {

          if(finished){
            return;
          }

          finished = true;

          reject(
            new Error(
              String(
                error ||
                "MP4 parsing failed."
              )
            )
          );
        };

      mp4.onMoovStart =
        () => {

          status.textContent =
            "Reading media information…";

        };

      mp4.onReady =
        info => {

          if(finished){
            return;
          }

          finished = true;

          resolve(info);
        };

      const CHUNK =
        1024 * 1024;

      let offset = 0;

      async function readNext(){

        if(finished){
          return;
        }

        try{

          const end =
            Math.min(
              offset + CHUNK,
              file.size
            );

          const buffer =
            await file
              .slice(offset,end)
              .arrayBuffer();

          buffer.fileStart =
            offset;

          mp4.appendBuffer(buffer);

          offset = end;

          if(
            offset < file.size &&
            !finished
          ){

            setTimeout(
              readNext,
              0
            );

          }else if(!finished){

            mp4.flush();

          }

        }catch(error){

          if(!finished){

            finished = true;

            reject(error);

          }

        }

      }

      readNext();

    }
  );
}


/* =========================================================
   MEDIA INFO
========================================================= */

async function readMediaInfo(file){

  status.textContent =
    "Reading media information…";

  try{

    const info =
      await parseMP4(file);

    const tracks =
      (info.videoTracks || [])
        .filter(Boolean);

    const track =
      tracks[0] ||
      info.tracks?.find(
        t => t.type === "video"
      );

    if(!track){
      throw new Error(
        "No video track found."
      );
    }

    const width =
      track.video?.width ||
      track.track_width ||
      0;

    const height =
      track.video?.height ||
      track.track_height ||
      0;

    let duration = NaN;

    if(
      Number.isFinite(
        track.movie_duration
      ) &&
      track.movie_duration > 0
    ){

      duration =
        track.movie_duration /
        (
          track.movie_timescale ||
          info.timescale ||
          1
        );

    }else if(
      Number.isFinite(track.duration) &&
      track.duration > 0
    ){

      duration =
        track.duration /
        (
          track.timescale ||
          1
        );
    }

    if(
      !Number.isFinite(duration) &&
      Number.isFinite(preview.duration)
    ){

      duration =
        preview.duration;
    }

    let fps = NaN;

    if(
      Number.isFinite(track.nb_samples) &&
      Number.isFinite(duration) &&
      duration > 0
    ){

      fps =
        track.nb_samples /
        duration;
    }

    let bitrate =
      Number(track.bitrate);

    if(
      !Number.isFinite(bitrate) ||
      bitrate <= 0
    ){

      if(
        Number.isFinite(duration) &&
        duration > 0
      ){

        bitrate =
          file.size *
          8 /
          duration;
      }
    }

    const format =
      simplifyCodec(
        track.codec
      );

    const quality =
      detectQuality(track);

    infoFile.textContent =
      file.name;

    infoSize.textContent =
      formatBytes(file.size);

    infoDuration.textContent =
      formatDuration(duration);

    infoResolution.textContent =
      width && height
        ? `${width} × ${height}`
        : "—";

    infoFps.textContent =
      Number.isFinite(fps)
        ? `${fps.toFixed(
            Math.abs(
              fps - Math.round(fps)
            ) < 0.03
              ? 0
              : 2
          )} fps`
        : "—";

    infoBitrate.textContent =
      formatBitrate(bitrate);

    infoFormat.textContent =
      format;

    infoQuality.textContent =
      quality;

    status.textContent =
      "Media information ready.";

  }catch(error){

    console.warn(
      "MP4Box error:",
      error
    );

    infoFile.textContent =
      file.name;

    infoSize.textContent =
      formatBytes(file.size);

    infoDuration.textContent =
      Number.isFinite(preview.duration)
        ? formatDuration(
            preview.duration
          )
        : "—";

    infoResolution.textContent =
      preview.videoWidth &&
      preview.videoHeight
        ? `${preview.videoWidth} × ${preview.videoHeight}`
        : "—";

    infoFps.textContent =
      "—";

    infoBitrate.textContent =
      "—";

    infoFormat.textContent =
      "MP4";

    infoQuality.textContent =
      "Unknown";

    status.textContent =
      "Basic information ready.";
  }
}


/* =========================================================
   FILE
========================================================= */

async function handleFile(file){

  if(!file){
    return;
  }

  if(
    file.type !== "video/mp4" &&
    !file.name
      .toLowerCase()
      .endsWith(".mp4")
  ){

    status.textContent =
      "Please choose an MP4 video.";

    return;
  }

  selectedFile =
    file;

  if(previewUrl){

    URL.revokeObjectURL(
      previewUrl
    );
  }

  previewUrl =
    URL.createObjectURL(file);

  preview.src =
    previewUrl;

  preview.load();

  fileName.textContent =
    file.name;

  dropzone.style.display =
    "none";

  previewArea.style.display =
    "block";

  infoSection.hidden =
    false;

  variantSection.hidden =
    false;

  patchButton.disabled =
    true;

  status.textContent =
    "Loading preview…";

  await new Promise(resolve => {

    if(
      preview.readyState >= 1
    ){

      resolve();
      return;
    }

    preview.addEventListener(
      "loadedmetadata",
      resolve,
      {once:true}
    );

  });

  patchButton.disabled =
    false;

  readMediaInfo(file);
}


/* =========================================================
   INPUT
========================================================= */

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files?.[0];

    if(file){
      handleFile(file);
    }

  }
);


/* =========================================================
   REPLACE
========================================================= */

replaceBtn.addEventListener(
  "click",
  event => {

    event.preventDefault();
    event.stopPropagation();

    videoInput.value =
      "";

    videoInput.click();

  }
);


/* =========================================================
   DRAG & DROP
========================================================= */

["dragenter","dragover"]
.forEach(type => {

  dropzone.addEventListener(
    type,
    event => {

      event.preventDefault();

      dropzone.classList.add(
        "dragover"
      );

    }
  );

});

["dragleave","drop"]
.forEach(type => {

  dropzone.addEventListener(
    type,
    event => {

      event.preventDefault();

      dropzone.classList.remove(
        "dragover"
      );

    }
  );

});

dropzone.addEventListener(
  "drop",
  event => {

    const file =
      event.dataTransfer
        ?.files?.[0];

    if(file){
      handleFile(file);
    }

  }
);


/* =========================================================
   COMPRESSBASE
========================================================= */

const {
  patchVideo
} =
  await import(
    "https://compressbase.com/method-api/client.mjs"
  );


/* =========================================================
   PATCH
========================================================= */

patchButton.addEventListener(
  "click",
  async () => {

    if(!selectedFile){

      status.textContent =
        "Choose an MP4 first.";

      return;
    }

    const postingDevice =
      variant.value;

    if(!postingDevice){

      status.textContent =
        "Choose a variant first.";

      return;
    }

    patchButton.disabled =
      true;

    manualDownload.style.display =
      "none";

    if(outputUrl){

      URL.revokeObjectURL(
        outputUrl
      );

      outputUrl =
        null;
    }

    status.textContent =
      "Patching metadata…";

    try{

      const output =
        await patchVideo(
          selectedFile,
          {
            postingDevice,

            signal:
              AbortSignal.timeout(
                180000
              ),

            onStatus:
              message => {

                status.textContent =
                  message;

              }
          }
        );

      outputUrl =
        URL.createObjectURL(
          output
        );

      const outputName =
        selectedFile.name
          .replace(
            /\.mp4$/i,
            ""
          ) +
        "_totolat.mp4";

      download.href =
        outputUrl;

      download.download =
        outputName;

      const link =
        document.createElement("a");

      link.href =
        outputUrl;

      link.download =
        outputName;

      link.style.display =
        "none";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      status.textContent =
        "Done. Download started.";

      setTimeout(
        () => {

          manualDownload.style.display =
            "block";

        },
        1200
      );

    }catch(error){

      console.error(error);

      status.textContent =
        error?.message ||
        "Patch failed.";

    }finally{

      patchButton.disabled =
        false;

    }

  }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(previewUrl){

      URL.revokeObjectURL(
        previewUrl
      );
    }

    if(outputUrl){

      URL.revokeObjectURL(
        outputUrl
      );
    }

  }
);

</script>
